{% extends 'accounts/admin_base.html' %}

{% block page_title %}Dashboard Overview{% endblock %}

{% block content %}
<h1>Dashboard Overview</h1>

<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:20px; margin-bottom:40px;">
    <div class="card">
        <h4>Total Orders</h4>
        <h2 style="font-size:2.8rem; margin:10px 0;">{{ total_orders }}</h2>
    </div>
    <div class="card">
        <h4>Total Revenue</h4>
        <h2 style="font-size:2.8rem; margin:10px 0; color:#10b981;">Rs. {{ total_revenue }}</h2>
    </div>
    <div class="card">
        <h4>Pending Orders</h4>
        <h2 style="font-size:2.8rem; margin:10px 0; color:#f59e0b;">{{ pending_orders }}</h2>
    </div>
    <div class="card">
        <h4>Low Stock Items</h4>
        <h2 style="font-size:2.8rem; margin:10px 0; color:#ef4444;">{{ low_stock }}</h2>
    </div>
</div>

{% endblock %}
