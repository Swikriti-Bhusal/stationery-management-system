<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Smart Stationery</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --cream:#f9f6f1;
            --ink:#1a1a1a;
            --coral:#e86b4a;
        }
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{
            font-family:'DM Sans',sans-serif;
            background: var(--cream);
            color:var(--ink);
        }
        nav{
            position:fixed; top:0; left:0; right:0;
            height:72px; background:rgba(249,246,241,0.97);
            backdrop-filter:blur(14px); border-bottom:1px solid rgba(0,0,0,0.08);
            z-index:1000; padding:0 40px;
        }
        .nav-inner{
            max-width:1240px; margin:auto; height:100%;
            display:flex; align-items:center; justify-content:space-between;
        }
        .logo{
            font-family:'Fraunces',serif;
            font-size:1.75rem;
            font-weight:700;
            color:var(--ink);
            text-decoration:none;
        }

        .contact-section{
            max-width:1100px;
            margin:120px auto 80px;
            padding:0 40px;
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:80px;
        }
        h1{
            font-family:'Fraunces',serif;
            font-size:2.8rem;
            margin-bottom:20px;
        }
        .contact-info p{
            margin:15px 0;
            font-size:1.05rem;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav>
    <div class="nav-inner">
        <a href="/" class="logo">Smart Stationery</a>
        <div>
            <a href="/">Home</a>
            <a href="{% url 'product_list' %}">Shop</a>
            <a href="/about/">About</a>
            <a href="/contact/">Contact</a>
        </div>
    </div>
</nav>

<div class="contact-section">
    <div>
        <h1>Get in Touch</h1>
        <p>We'd love to hear from you! Whether you have a question about our products, need help with an order, or just want to say hello.</p>
        
        <div class="contact-info">
            <p><strong>📍 Address:</strong> Bharatpur, Chitwan</p>
            <p><strong>📞 Phone:</strong> +977 980-1234567</p>
            <p><strong>✉️ Email:</strong> hello@smartstationery.com.np</p>
        </div>
    </div>

    
</div>

</body>
</html>
