<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Smart Stationery</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --cream:#f9f6f1;
            --ink:#1a1a1a;
            --coral:#e86b4a;
        }
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{
            font-family:'DM Sans',sans-serif;
            background:var(--cream);
            color:var(--ink);
        }
        .cart-link {
            cursor: pointer;
            text-decoration: none;
            color: #555;
            font-weight: 500;
            margin-right: 20px;
        }
        
        .cart-link:hover {
            color: var(--coral);
        }

        .products-grid{
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
            gap:26px;
            max-width:1240px;
            margin:100px auto 60px;
            padding:0 40px;
        }

        .product-card{
            background:white;
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 5px 15px rgba(0,0,0,0.08);
            transition:0.3s;
        }
        .product-card:hover{
            transform:translateY(-8px);
            box-shadow:0 15px 35px rgba(0,0,0,0.12);
        }
        .product-image img{
            width:100%; height:240px; object-fit:cover;
        }
        .product-info{
            padding:18px;
        }
        .product-category{
            color:#888; font-size:0.85rem;
        }
        .product-name{
            font-size:1.05rem; font-weight:700; margin:8px 0;
        }
        .price{
            color:var(--coral); font-size:1.35rem; font-weight:700;
        }
        .cart-btn{
            background:var(--ink); color:white; border:none;
            padding:10px 20px; border-radius:10px; cursor:pointer;
            font-weight:600;
        }
        .cart-btn:hover{
            background:var(--coral);
        }
        
        /* Toast message styling */
        .toast-message {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #28a745;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-weight: 500;
        }
    </style>
</head>
<body>


{% include 'navbar.html' %}

<div style="max-width:1240px; margin:100px auto 40px; padding:0 40px;">
    <h1 style="font-family:'Fraunces',serif; font-size:2.8rem; text-align:center;">All Products</h1>
</div>

<div class="products-grid">
    {% for product in products %}
    <div class="product-card">
        {% if product.image %}
            <div class="product-image">
                <img src="{{ product.image.url }}" alt="{{ product.name }}">
            </div>
        {% endif %}
        <div class="product-info">
            <div class="product-category">{{ product.category.name }}</div>
            <div class="product-name">{{ product.name }}</div>
            <div class="price">Rs. {{ product.price }}</div>
            
            <button onclick="addToCart({{ product.id }}, '{{ product.name }}')" class="cart-btn" style="margin-top:12px; width:100%;">
                + Add to Cart
            </button>
        </div>
    </div>
    {% empty %}
        <p style="text-align:center; grid-column:1/-1; font-size:1.2rem;">No products found.</p>
    {% endfor %}
</div>

<script>
function addToCart(productId, productName){
    {% if user.is_authenticated %}
        // Save message to show after page reload
        localStorage.setItem('toastMessage', productName + " added to cart! 🛒");
        window.location.href = "{% url 'cart:add_to_cart' 0 %}".replace('0', productId);
    {% else %}
        alert("Please login to add items to cart.");
        window.location.href = "{% url 'customer_login' %}";
    {% endif %}
}

// Show message when page loads
window.onload = function() {
    var message = localStorage.getItem('toastMessage');
    if(message) {
        var toast = document.createElement('div');
        toast.innerHTML = message;
        toast.style.cssText = 'position:fixed; top:80px; left:50%; transform:translateX(-50%); background:#28a745; color:white; padding:12px 25px; border-radius:8px; z-index:9999;';
        document.body.appendChild(toast);
        
        setTimeout(function() {
            toast.remove();
            localStorage.removeItem('toastMessage');
        }, 4000);
    }
}
</script>

</body>
</html>
