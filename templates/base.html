<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Stationery{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ALL YOUR CSS STYLES HERE */
        :root{
            --cream:#f9f6f1;
            --ink:#1a1a1a;
            --coral:#e86b4a;
            --gray:#666;
            --card-radius:18px;
        }
        /* ... rest of your CSS ... */
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav>
    <div class="nav-inner">
        <a href="/" class="logo">Smart Stationery</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="{% url 'product_list' %}">Shop</a>
            <a href="{% url 'about' %}">About</a>
            <a href="{% url 'contact' %}">Contact</a>
        </div>
        <div class="nav-actions">
            {% if user.is_authenticated %}
                <span class="user-greeting">Hi, {{ user.full_name|default:user.email|truncatechars:15 }}</span>
                <a href="{% url 'customer_dashboard' %}">Dashboard</a>
                <a href="{% url 'customer_logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'customer_login' %}">Login</a>
                <a href="{% url 'customer_register' %}" class="register-btn">Register</a>
            {% endif %}
        </div>
    </div>
</nav>

<!-- MAIN CONTENT -->
{% block content %}
{% endblock %}

</body>
</html>
