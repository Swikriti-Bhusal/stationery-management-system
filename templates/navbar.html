<!-- Navigation Bar CSS -->
<style>
    /* Navbar Styles */
    .navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 72px;
        background: rgba(249, 246, 241, 0.97);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 1000;
        padding: 0 40px;
    }

    .nav-inner {
        max-width: 1240px;
        margin: auto;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .logo {
        font-family: 'Fraunces', serif;
        font-size: 1.75rem;
        font-weight: 700;
        color: #1a1a1a;
        text-decoration: none;
    }

    .nav-links {
        display: flex;
        align-items: center;
        gap: 30px;
    }

    .nav-links a {
        text-decoration: none;
        color: #555;
        font-weight: 500;
        transition: color 0.3s;
    }

    .nav-links a:hover {
        color: #1a1a1a;
    }

    .nav-actions {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .nav-actions a {
        text-decoration: none;
        color: #555;
        font-weight: 500;
        transition: color 0.3s;
    }

    .nav-actions a:hover {
        color: #e86b4a;
    }

    .cart-link {
        cursor: pointer;
        text-decoration: none;
        color: #555;
        font-weight: 500;
    }

    .register-btn {
        background: #1a1a1a;
        color: white !important;
        padding: 8px 18px;
        border-radius: 50px;
        text-decoration: none;
        font-size: 0.9rem;
    }

    .register-btn:hover {
        background: #e86b4a;
        color: white !important;
    }

    .user-greeting {
        margin-right: 5px;
        font-weight: 500;
        color: #e86b4a;
    }

    .logout-link {
        color: #e86b4a !important;
        font-weight: 600;
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
        .navbar {
            padding: 0 15px;
        }
        
        .nav-links {
            gap: 15px;
        }
        
        .nav-links a {
            font-size: 14px;
        }
        
        .user-greeting {
            display: none;
        }
    }
</style>

<!-- Navigation Bar HTML -->
<div class="navbar">
    <div class="nav-inner">
        <a href="/" class="logo">Smart Stationery</a>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="{% url 'product_list' %}">Shop</a>
            <a href="{% url 'about' %}">About</a>
            <a href="{% url 'contact' %}">Contact</a>
        </div>

        <div class="nav-actions">
            <!-- Cart Link -->
            {% if user.is_authenticated %}
                <a href="{% url 'cart:cart_view' %}" class="cart-link">🛒 Cart</a>
            {% else %}
                <a href="javascript:void(0);" onclick="checkLoginAndRedirect('{% url 'cart:cart_view' %}')" class="cart-link">🛒 Cart</a>
            {% endif %}
            
            <!-- My Orders Link -->
            {% if user.is_authenticated %}
                <a href="{% url 'orders:my_orders' %}">My Orders</a>
            {% endif %}
            
            <!-- User Menu -->
            {% if user.is_authenticated %}
                <span class="user-greeting">👋 {{ user.full_name|default:user.email|truncatechars:15 }}</span>
                <a href="{% url 'customer_logout' %}" class="logout-link">Logout</a>
            {% else %}
                <a href="{% url 'customer_login' %}">Login</a>
                <a href="{% url 'customer_register' %}" class="register-btn">Register</a>
            {% endif %}
        </div>
    </div>
</div>

<!-- JavaScript for cart redirect when not logged in -->
<script>
function checkLoginAndRedirect(url){
    {% if user.is_authenticated %}
        window.location.href = url;
    {% else %}
        alert("Please login to view your cart.");
        window.location.href = "{% url 'customer_login' %}";
    {% endif %}
}
</script>
